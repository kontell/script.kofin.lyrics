[tox]
envlist = black, mypy, compileall, translations

[testenv]
skip_install = true
deps = -r requirements-dev.txt

[testenv:black]
commands = black --check --diff .

[testenv:mypy]
commands = mypy

# No unit tests: the modules need a live Kodi. Verify by playing a song with
# lyrics, with a skin that draws its own overlay and with one that does not.
[testenv:compileall]
commands = python -m compileall -q default.py service.py lib/ tools/

[testenv:translations]
deps =
commands =
    python tools/i18n/gen.py --check
    python tools/i18n/validate.py
    python tools/i18n/pocheck.py
