[tox]
envlist = black, mypy, compileall

[testenv]
skip_install = true
deps = -r requirements-dev.txt

[testenv:black]
commands = black --check --diff .

[testenv:mypy]
commands = mypy

# No unit suite: every module here talks to a live Kodi (window controls,
# InfoLabels, the player clock), so mypy carries most of the weight and this is
# the syntax floor. Live verification is playing a track with lyrics on the
# server, both with a skin that draws its own overlay and with one that does not.
[testenv:compileall]
commands = python -m compileall -q default.py service.py lib/ tools/
