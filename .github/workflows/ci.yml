# Quality gates + PR install zip. Shape mirrors plugin.video.kofin ci.yml:
# this file is the every-PR gate; release.yml handles tags.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  black:
    name: black
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          # setup-python builds its cache key from requirements.txt or
          # pyproject.toml by default and errors when it finds neither. This repo
          # has requirements-dev.txt, so it has to be named. (kofin and
          # music.restore pass without this only because they carry a pyproject.toml.)
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: black --check
        run: black --check --diff .

  mypy:
    name: mypy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          # setup-python builds its cache key from requirements.txt or
          # pyproject.toml by default and errors when it finds neither. This repo
          # has requirements-dev.txt, so it has to be named. (kofin and
          # music.restore pass without this only because they carry a pyproject.toml.)
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: mypy
        run: mypy

  compileall:
    name: compileall
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: compileall
        # There is no unit suite: every module here talks to a live Kodi
        # (window controls, InfoLabels, the player clock). mypy carries most of
        # the weight; this is the syntax floor for the two entry points mypy's
        # `files` list does not reach through.
        run: python -m compileall -q default.py service.py lib/ tools/

  package:
    name: package
    # Independent of the gates so a style failure still yields an install zip.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build zip
        run: python3 tools/build.py dist

      - name: Name zip for this run
        id: name
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(dist/script.kofin.lyrics-*.zip)
          if [[ ${#zips[@]} -ne 1 ]]; then
            echo "expected exactly one zip in dist/, got: ${zips[*]:-none}" >&2
            exit 1
          fi
          src="${zips[0]}"
          base="$(basename "$src" .zip)"
          sha7="$(echo "${{ github.sha }}" | cut -c1-7)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            dest="dist/${base}-pr${{ github.event.pull_request.number }}-${sha7}.zip"
          else
            dest="dist/${base}-main-${sha7}.zip"
          fi
          mv "$src" "$dest"
          echo "zip=$dest" >> "$GITHUB_OUTPUT"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: script.kofin.lyrics-zip
          path: ${{ steps.name.outputs.zip }}
          retention-days: 14
          if-no-files-found: error
