# Tell repository.kontell a release was published, so it updates now rather
# than at its next scheduled reconcile.
# - `release` events only run workflows on the default branch.
# - Events raised with the default GITHUB_TOKEN start no workflows: publish
#   drafts from the GitHub UI or with your own credentials.
# - The dispatch needs a token for the other repo: a GitHub App's, scoped to it.
# Until the App is configured this is a no-op. See repository.kontell's
# docs/publishing.md.
name: Notify repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to announce (blank = latest published)"
        type: string
        default: ""

# The dispatch uses the App token.
permissions: {}

env:
  ADDON_ID: script.kofin.lyrics
  TARGET_REPO: kontell/repository.kontell

jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the dispatch App is configured
        id: configured
        run: |
          if [[ -z "${{ vars.REPO_DISPATCH_APP_ID }}" ]]; then
            echo "::notice::REPO_DISPATCH_APP_ID is not set, so no dispatch will be"\
                 "sent. ${{ env.TARGET_REPO }} will pick this release up on its next"\
                 "scheduled reconcile (within 30 minutes). See that repo's"\
                 "docs/publishing.md to configure the App."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint an App installation token
        if: steps.configured.outputs.ready == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REPO_DISPATCH_APP_ID }}
          private-key: ${{ secrets.REPO_DISPATCH_APP_PRIVATE_KEY }}
          owner: kontell
          repositories: repository.kontell

      - name: Dispatch
        if: steps.configured.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          echo "announcing ${ADDON_ID} ${TAG:-<latest>} to ${TARGET_REPO}"
          gh api "repos/${TARGET_REPO}/dispatches" \
            -f event_type=addon-released \
            -f "client_payload[addon]=${ADDON_ID}" \
            -f "client_payload[tag]=${TAG}" \
            -f "client_payload[source]=${GITHUB_REPOSITORY}"
          echo "dispatched. Follow it at" \
               "https://github.com/${TARGET_REPO}/actions/workflows/publish.yml"
