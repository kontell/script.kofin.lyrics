# Prepares a release for the official Kodi repository: one commit,
# "[script.kofin.lyrics] <version>", pushed to the script.kofin.lyrics@piers
# branch of the kontell/repo-scripts fork. The pull request against
# xbmc/repo-scripts:piers is opened from that branch by hand. Run by hand
# (Actions -> Submit to Kodi -> Run workflow) with the release's tag.
#
# Needs two repository secrets: GH_TOKEN, a classic token with public_repo
# scope, which updates the fork; and EMAIL, the address the submission commit
# is authored with.
name: Submit to Kodi

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to submit, e.g. v0.3.1"
        required: true
        type: string

permissions:
  contents: read

# Runs share the fork's branch, which each one force-pushes.
concurrency: submit-to-kodi

env:
  ADDON_ID: script.kofin.lyrics
  KODI_REPO: repo-scripts
  KODI_BRANCH: piers

jobs:
  submit:
    name: submit
    runs-on: ubuntu-24.04
    steps:
      - name: Check the secrets are set
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EMAIL: ${{ secrets.EMAIL }}
        run: |
          if [[ -z "$GH_TOKEN" || -z "$EMAIL" ]]; then
            echo "::error::Set the GH_TOKEN and EMAIL repository secrets first."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Use the current export-ignore list for an older tag
        # v0.3.1 predates .gitattributes. git archive also reads
        # .git/info/attributes, so the tag is packed by today's list.
        if: hashFiles('.gitattributes') == ''
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch -q --depth=1 origin "$DEFAULT_BRANCH"
          git show FETCH_HEAD:.gitattributes > .git/info/attributes

      - name: Check what will be submitted
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(python3 -c "
          import xml.etree.ElementTree as ET
          print(ET.parse('addon.xml').getroot().get('version'))
          ")"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match addon.xml version $version."
            exit 1
          fi
          files="$(git archive HEAD | tar -t)"
          echo "$files"
          if grep -E '^(\.github|tools)/|^(\.gitattributes|\.gitignore|mypy\.ini|requirements-dev\.txt|tox\.ini)$' <<< "$files"; then
            echo "::error::Development files would be submitted."
            exit 1
          fi

      - name: Commit it to the fork
        # bash with pipefail: a failed git archive must not push.
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EMAIL: ${{ secrets.EMAIL }}
          GH_USERNAME: ${{ github.actor }}
        run: |
          fork="$GH_USERNAME/$KODI_REPO"
          branch="$ADDON_ID@$KODI_BRANCH"
          # The fork's piers must hold upstream's tip: a commit made on a
          # shallow clone pushes only onto history the fork already has.
          gh repo sync "$fork" --branch "$KODI_BRANCH"
          git clone -q --depth 1 --branch "$KODI_BRANCH" \
            "https://x-access-token:$GH_TOKEN@github.com/$fork.git" "$RUNNER_TEMP/fork"
          cd "$RUNNER_TEMP/fork"
          git checkout -q -b "$branch"
          git rm -rq --ignore-unmatch "$ADDON_ID"
          git -C "$GITHUB_WORKSPACE" archive --prefix "$ADDON_ID/" HEAD | tar -x
          git add "$ADDON_ID"
          git -c user.name="$GH_USERNAME" -c user.email="$EMAIL" \
            commit -q -m "[$ADDON_ID] ${TAG#v}"
          git push -q -f origin "$branch"
